name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest -q
